[project]
name = "gdh-ingestion"
version = "1.0.0"
description = "Data ingestion collectors for GDH Chatbot"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "docling>=1.11.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "html5lib>=1.1",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
